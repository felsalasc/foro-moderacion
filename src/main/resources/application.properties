spring.application.name=foro-moderacion
spring.profiles.default=local
server.port=${PORT:8083}
spring.jpa.open-in-view=false
usuarios.base-url=${USUARIOS_BASE_URL:http://localhost:8081}
usuarios.connect-timeout=${USUARIOS_CONNECT_TIMEOUT:2s}
usuarios.read-timeout=${USUARIOS_READ_TIMEOUT:3s}
contenido.base-url=${CONTENIDO_BASE_URL:http://localhost:8082}
contenido.connect-timeout=${CONTENIDO_CONNECT_TIMEOUT:2s}
contenido.read-timeout=${CONTENIDO_READ_TIMEOUT:3s}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-numbers-for-enums=true
spring.jackson.mapper.allow-coercion-of-scalars=false
